{% extends "base.html" %}
{% block title %}새 비밀번호 설정 - {{ brand_name }}{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="card">
      <h1>새 비밀번호 설정</h1>
      <form method="post">
        <div class="form-group">
          <label>새 비밀번호</label>
          <input type="password" name="password" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-block">비밀번호 변경</button>
      </form>
    </div>
  </div>
{% endblock %}

{% extends "base.html" %}
{% block title %}문의 작성 - {{ brand_name }}{% endblock %}
{% block content %}
  <div class="breadcrumb"><a href="{{ url_for('board_qna_list') }}">Q&amp;A 게시판</a> &rsaquo; 문의 작성</div>
  <h1>문의 작성</h1>

  <div class="card" style="max-width:640px;">
    <form method="post">
      <div class="form-group">
        <label>카테고리</label>
        <select name="category">
          {% for c in categories %}
            <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>제목</label>
        <input type="text" name="title" placeholder="문의 제목을 입력해주세요" required>
      </div>
      <div class="form-group">
        <label>내용</label>
        <textarea name="content" rows="6" placeholder="문의하실 내용을 자세히 남겨주세요" required></textarea>
      </div>
      <label class="checkbox-row"><input type="checkbox" name="is_secret" value="1"> 비밀글로 작성 (작성자와 관리자만 열람)</label>
      <button type="submit" class="btn btn-primary" style="margin-top:16px;">등록하기</button>
    </form>
  </div>
{% endblock %}

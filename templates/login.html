{% extends "base.html" %}
{% block title %}로그인 - {{ brand_name }}{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="card">
      <h1>로그인</h1>
      <form method="post">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div class="form-group">
          <label>아이디</label>
          <input type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>
      <p class="auth-footer">
        <a href="{{ url_for('forgot_password') }}">비밀번호를 잊으셨나요?</a>
      </p>
      <p class="auth-footer">
        아직 회원이 아니신가요? <a href="{{ url_for('register') }}">회원가입</a>
      </p>
    </div>
  </div>
{% endblock %}

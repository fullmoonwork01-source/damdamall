{% extends "base.html" %}
{% block title %}비밀번호 찾기 - {{ brand_name }}{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="card">
      <h1>비밀번호 재설정</h1>
      <p class="muted">가입 시 사용한 아이디를 입력하시면 재설정 링크를 보내드립니다.</p>
      <form method="post">
        <div class="form-group">
          <label>아이디</label>
          <input type="text" name="username" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-block">재설정 링크 받기</button>
      </form>
      <p class="auth-footer"><a href="{{ url_for('login') }}">로그인으로 돌아가기</a></p>
    </div>
  </div>
{% endblock %}

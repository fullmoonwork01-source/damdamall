{% extends "base.html" %}
{% block title %}문의 수정 - {{ brand_name }}{% endblock %}
{% block content %}
  <div class="breadcrumb"><a href="{{ url_for('board_qna_list') }}">Q&amp;A 게시판</a> &rsaquo; 문의 수정</div>
  <h1>문의 수정</h1>

  <div class="card" style="max-width:640px;">
    <form method="post">
      <div class="form-group">
        <label>카테고리</label>
        <select name="category">
          {% for c in categories %}
            <option value="{{ c }}" {{ 'selected' if post['category'] == c }}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>제목</label>
        <input type="text" name="title" value="{{ post['title'] }}" required>
      </div>
      <div class="form-group">
        <label>내용</label>
        <textarea name="content" rows="6" required>{{ post['content'] }}</textarea>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" name="is_secret" value="1" {{ 'checked' if post['is_secret'] }}>
        비밀글로 설정 (작성자와 관리자만 열람)
      </label>
      <button type="submit" class="btn btn-primary" style="margin-top:16px;">수정 완료</button>
    </form>
  </div>
{% endblock %}

{% extends "base.html" %}
{% block title %}회원가입 - {{ brand_name }}{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="card">
      <h1>회원가입</h1>
      <form method="post">
        <div class="form-group">
          <label>아이디</label>
          <input type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
          <label>이메일</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>닉네임</label>
          <input type="text" name="nickname">
          <p class="form-hint">비워두면 아이디로 자동 설정됩니다.</p>
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">가입하기</button>
      </form>
      <p class="auth-footer">이미 회원이신가요? <a href="{{ url_for('login') }}">로그인</a></p>
    </div>
  </div>
{% endblock %}
